name: Task 26 Live QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: task-26-live-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for current production targets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "Production readiness attempt ${attempt}/12"
            if node scripts/verify-v0.1-deployments.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Production targets did not become ready." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Prepare Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-runtime
          cp e2e/playwright.config.mjs e2e/sessions-devices-v0.1.spec.mjs playwright-runtime/
          cd playwright-runtime
          npm init -y >/dev/null
          npm install --save-exact @playwright/test@1.62.1
          npx playwright install --with-deps chromium

      - name: Run task 26 live QA
        working-directory: playwright-runtime
        run: npx playwright test sessions-devices-v0.1.spec.mjs --config=playwright.config.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-26-live-qa-${{ github.run_id }}
          path: |
            playwright-runtime/playwright-report
            playwright-runtime/test-results
          if-no-files-found: ignore
          retention-days: 7
