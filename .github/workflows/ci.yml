name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate Supabase Edge Functions
        run: pnpm check:edge-functions
      - name: Validate commercial pricing guardrails
        run: pnpm check:commercial-pricing
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          MANDYS_STOREFRONT_HOSTNAME: "demo.mandys.local"
      - name: Dependency audit
        run: pnpm audit --audit-level high

  live-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify current Netlify targets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "Live readiness attempt ${attempt}/12"
            if node scripts/verify-v0.1-deployments.mjs; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Netlify targets did not reach V0.1 smoke readiness after deployment grace period." >&2
              exit 1
            fi
            sleep 30
          done
      - name: Verify critical Edge runtimes and pre-launch safety switches
        run: node scripts/verify-edge-runtime-health.mjs

  live-browser-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: live-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-runtime
          cp e2e/playwright.config.mjs e2e/live-v0.1.spec.mjs e2e/authenticated-v0.1.spec.mjs e2e/account-profile-v0.1.spec.mjs e2e/change-password-v0.1.spec.mjs e2e/password-recovery-v0.1.spec.mjs e2e/email-verification-v0.1.spec.mjs e2e/sessions-devices-v0.1.spec.mjs e2e/billing-fail-closed.spec.mjs e2e/roles-v0.1.spec.mjs e2e/performance-v0.2.spec.mjs playwright-runtime/
          cd playwright-runtime
          npm init -y >/dev/null
          npm install --save-exact @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Run live browser E2E
        working-directory: playwright-runtime
        run: npx playwright test live-v0.1.spec.mjs authenticated-v0.1.spec.mjs account-profile-v0.1.spec.mjs change-password-v0.1.spec.mjs password-recovery-v0.1.spec.mjs email-verification-v0.1.spec.mjs sessions-devices-v0.1.spec.mjs billing-fail-closed.spec.mjs roles-v0.1.spec.mjs performance-v0.2.spec.mjs --config=playwright.config.mjs
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-browser-e2e-${{ github.run_id }}
          path: |
            playwright-runtime/playwright-report
            playwright-runtime/test-results
          if-no-files-found: ignore
          retention-days: 7
