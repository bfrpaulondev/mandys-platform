name: Cleanup task 22 branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-task22-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Delete audited obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "feat/task-22-user-profile" \
            "qa/task-22-live-certification" \
            "docs/certify-task-22"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
