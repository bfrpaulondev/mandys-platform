name: Cleanup task 23 branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-task23-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Delete audited obsolete task 23 branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "chore/task-23-backlog-certification" \
            "feat/task-23-change-password" \
            "fix/task-23-active-organization" \
            "fix/task-23-capture-active-organization" \
            "fix/task-23-live-signout-request" \
            "qa/task-23-live-certification" \
            "test/task-23-auth-verification-isolation"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
