name: Cleanup task 24 branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-task24-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Delete audited obsolete task 24 branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "docs/task-24-certification" \
            "feat/task-24-password-recovery" \
            "feat/task-24-password-reset" \
            "fix/task-24-public-reset-route" \
            "qa/task-24-live-certification"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
