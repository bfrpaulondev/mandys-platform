[build]
command = "pnpm --filter @mandys/backoffice build"
edge_functions = "apps/backoffice/netlify/edge-functions"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.15.0"
PNPM_FLAGS = "--shamefully-hoist"

[[edge_functions]]
function = "dashboard"
path = "/api/dashboard"

[[edge_functions]]
function = "operational-runtime"
path = "/api/menu/*"

[[edge_functions]]
function = "operational-runtime"
path = "/api/reservations/*"

[[edge_functions]]
function = "operational-runtime"
path = "/api/crm/*"

[[edge_functions]]
function = "operational-runtime"
path = "/api/orders/*"

[[edge_functions]]
function = "operational-runtime"
path = "/api/stock/*"

[[edge_functions]]
function = "operational-runtime"
path = "/api/notifications/*"
